<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="happy-page-mode" content="app">
<meta name="happy-app-close" content="top-end">
<title>The Overlook Well</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  body.idle, body.idle canvas { cursor: none; }

  .hud {
    position: fixed;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom), var(--happy-app-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    font: 13px/1.3 -apple-system, system-ui, sans-serif;
    color: rgba(225, 245, 245, 0.85);
    background: rgba(0, 18, 20, 0.55);
    border: 1px solid rgba(150, 220, 220, 0.18);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    transition: opacity 0.6s;
    user-select: none;
  }
  body.idle .hud { opacity: 0; pointer-events: none; }
  .hud button, #vr {
    font: inherit; color: inherit; cursor: pointer;
    background: transparent;
    border: 1px solid rgba(150, 220, 220, 0.3);
    border-radius: 6px; padding: 5px 10px;
  }
  .hud button[aria-pressed="true"] { background: rgba(150, 220, 220, 0.18); }
  .hud label { display: flex; align-items: center; gap: 6px; }
  .hud input[type="range"] { width: 110px; accent-color: #ff6a10; }
  #vr { position: static !important; width: auto !important; left: auto !important; bottom: auto !important; opacity: 1 !important; }
  .hint { opacity: 0.6; }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 14px -apple-system, system-ui, sans-serif; color: rgba(225, 245, 245, 0.7);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="status">Loading the well…</div>
<div class="hud" id="hud">
  <button id="film" aria-pressed="true" title="The camera falls and turns, as in the film (F)">Film</button>
  <button id="free" aria-pressed="false" title="Look around yourself; drag to look (L)">Free look</button>
  <button id="fall" aria-pressed="true" title="Fall or hover (Space)">Falling</button>
  <label title="Speed of everything">Speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1"></label>
  <span class="hint">Drag to look</span>
  <span id="vrslot"></span>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
