<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05050a" />
    <meta name="happy-page-mode" content="app" />
    <meta name="happy-page-width" content="full" />
    <title>Happy · Bring Back the Light</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; }
      body { font-family: ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #f3e9d8; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #toast { padding: 7px 14px; border-radius: 999px; font-size: 12px; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; background: rgba(12, 9, 18, 0.82); border: 1px solid rgba(255, 213, 138, 0.4); opacity: 0; transform: translateY(6px); transition: opacity 0.25s, transform 0.25s; }
      #toast.show { opacity: 1; transform: none; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 1px solid #ffd58a; outline-offset: 3px; }

      .top {
        position: fixed; top: max(14px, env(safe-area-inset-top)); left: 64px; right: 64px;
        text-align: center; pointer-events: none; user-select: none;
        text-shadow: 0 1px 10px #000, 0 0 3px #000;
      }
      .top h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
      .top p { margin: 4px 0 0; font-size: 12px; opacity: 0.72; transition: opacity 0.6s; }
      .top p.done { opacity: 0; }
      #progress {
        display: inline-block; margin-top: 7px; padding: 4px 12px; border-radius: 999px; font-size: 12px;
        letter-spacing: 0.08em; font-variant-numeric: tabular-nums; color: #ffd58a;
        background: rgba(10, 8, 16, 0.6); border: 1px solid rgba(255, 213, 138, 0.28);
      }

      .bottom {
        position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
      }
      .moths { display: flex; gap: 6px; max-width: calc(100vw - 16px); pointer-events: auto; }
      .moths button {
        display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 12px 7px 9px; border-radius: 14px;
        text-align: left; background: rgba(10, 8, 16, 0.62); border: 1px solid rgba(255, 236, 200, 0.16);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color 0.2s, background 0.2s;
      }
      .moths button[aria-pressed='true'] { border-color: var(--c); background: rgba(40, 32, 50, 0.8); box-shadow: 0 0 16px -4px var(--c); }
      .moths .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
      .moths b { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
      .moths small { display: block; font-size: 10px; opacity: 0.65; white-space: nowrap; min-width: 54px; }
      .moths #restart { padding: 7px 11px; font-size: 15px; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 7px; opacity: 0.5; user-select: none; letter-spacing: 0.3em; font-size: 9px; text-transform: uppercase; }
      .brand svg { width: 13px; height: 13px; }

      #win {
        position: fixed; left: 50%; bottom: 20%; transform: translate(-50%, 12px); text-align: center;
        padding: 16px 26px 18px; border-radius: 18px; width: max-content; max-width: calc(100vw - 48px); box-sizing: border-box;
        background: rgba(12, 9, 18, 0.78); border: 1px solid rgba(255, 213, 138, 0.45);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 0 60px -10px rgba(255, 190, 80, 0.5);
        opacity: 0; visibility: hidden; transition: opacity 0.8s 0.9s, transform 0.8s 0.9s, visibility 0s 1.7s;
      }
      #win.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity 0.8s 0.9s, transform 0.8s 0.9s; }
      #win h2 { margin: 0; font-size: 19px; font-weight: 600; color: #ffd58a; }
      #win p { margin: 5px 0 13px; font-size: 12px; opacity: 0.75; }
      #again { padding: 9px 22px; border-radius: 999px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; background: rgba(255, 213, 138, 0.16); border: 1px solid rgba(255, 213, 138, 0.6); }
      #again:hover { background: rgba(255, 213, 138, 0.3); }
    </style>
    <script type="module" crossorigin src="./assets/index-Dp3w6V54.js"></script>
  </head>
  <body>
    <canvas id="scene" aria-label="A broken stained-glass window, loose shards of glass and their openings"></canvas>
    <div class="top">
      <h1>Match each shard to its opening</h1>
      <p id="hint">Imagine turning the piece. Choose it, then its opening.</p>
      <div id="progress" role="status" aria-live="polite">0 / 8 restored</div>
    </div>
    <div class="bottom">
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="moths" id="moths">
        <button id="restart" type="button" title="Restart (R)" aria-label="Restart">↺</button>
      </div>
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffd58a" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="10.2" opacity="0.55" />
          <path d="M7.4 13.6c1 2.3 2.7 3.5 4.6 3.5s3.6-1.2 4.6-3.5" />
          <circle cx="8.9" cy="9.4" r="0.7" fill="#ffd58a" />
          <circle cx="15.1" cy="9.4" r="0.7" fill="#ffd58a" />
        </svg>
        <span>Happy · living glass</span>
      </div>
    </div>
    <div id="win" role="dialog" aria-label="Window restored">
      <h2>The light is back.</h2>
      <p>Every pane is home. The window is smiling.</p>
      <button id="again" type="button">Play again</button>
    </div>
  </body>
</html>
